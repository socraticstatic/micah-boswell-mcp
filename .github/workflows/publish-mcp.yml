name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io when a v* tag is
# pushed. Auth is GitHub Actions OIDC: `mcp-publisher login github-oidc`
# exchanges the workflow token for registry credentials scoped to the
# io.github.socraticstatic namespace. No stored secret.
#
# Release: bump the version (server.json, public/server.json, package.json,
# lib/data.js), deploy with `vercel --prod --yes`, then
#   git tag v1.0.1 && git push origin v1.0.1
# The job refuses a tag that disagrees with the card or with the live server.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token exchange with the MCP registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Tag must match server.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARD="$(jq -r .version server.json)"
          if [ "$TAG" != "$CARD" ]; then
            echo "::error::tag v$TAG does not match server.json version $CARD"
            exit 1
          fi
          echo "Publishing version $CARD"

      - name: Live server must already report this version
        run: |
          CARD="$(jq -r .version server.json)"
          LIVE="$(curl -fsS https://micah-boswell-mcp.vercel.app/healthz | jq -r .version)"
          if [ "$LIVE" != "$CARD" ]; then
            echo "::error::live server reports $LIVE, card says $CARD - deploy first (vercel --prod --yes)"
            exit 1
          fi

      - name: Install mcp-publisher
        # Pinned release; update deliberately, not via `latest`.
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

      - name: Verify it is actually being served
        run: |
          NAME="$(jq -r .name server.json)"
          CARD="$(jq -r .version server.json)"
          for attempt in 1 2 3 4 5 6; do
            FOUND="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=micah-boswell" \
              | jq -r --arg n "$NAME" --arg v "$CARD" '.servers[] | select(.server.name == $n and .server.version == $v) | .server.version' | head -1)"
            if [ -n "$FOUND" ]; then
              echo "registry is serving $NAME $FOUND"
              exit 0
            fi
            echo "attempt $attempt: not visible yet, waiting"
            sleep 10
          done
          echo "::error::published but the registry is not serving $NAME $CARD"
          exit 1
